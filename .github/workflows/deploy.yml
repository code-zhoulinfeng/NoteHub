name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 仓库级命名空间，必须全小写（Docker 镜像名不允许大写）。
  # 三段式 owner/repo/image 才能让 GITHUB_TOKEN 的 packages:write 生效。
  IMAGE: ${{ github.repository_owner }}/notehub/notehub

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/notehub.dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=notehub
          cache-to: type=gha,mode=max,scope=notehub

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_URL: ${{ secrets.APP_URL }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          set -euo pipefail

          APP_DIR=/opt/stacks/notehub
          mkdir -p "$APP_DIR"

          # 同步 compose 文件
          cp docker/docker-compose.yml "$APP_DIR/docker-compose.yml"
          cd "$APP_DIR"

          # 登录 GHCR（拉取私有镜像）
          echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

          # 动态生成 .env（含密钥，权限 600）
          umask 077
          {
            echo "NODE_ENV=production"
            echo "APP_URL=$APP_URL"
            echo "GITHUB_CLIENT_ID=$GITHUB_CLIENT_ID"
            echo "GITHUB_CLIENT_SECRET=$GITHUB_CLIENT_SECRET"
            echo "AUTH_SECRET=$AUTH_SECRET"
            echo "DATABASE_URL=file:/data/notehub.db"
            echo "APP_IMAGE=$REGISTRY/$IMAGE:latest"
          } > .env

          # 拉取最新镜像并重启
          docker compose pull
          docker compose up -d --remove-orphans

          # 清理悬空镜像，避免磁盘堆积
          docker image prune -f
