    content: `# Next.js App Router

App Router 是 Next.js 13 引入的新路由体系，以 **React Server Components** 为默认心智模型。

## 为什么是 Server Components

传统 SSR 会把组件在服务端渲染成 HTML，再在客户端 hydrate 一遍。App Router 把组件分成两类：

- **Server Component**：默认，在服务端执行，不打包进客户端 bundle
- **Client Component**：需要 \`"use client"\` 声明，可以访问浏览器 API

> 一个实用的判断标准：需要状态、事件、浏览器 API 时，才下沉成 Client Component。

## 数据获取

在 Server Component 里可以直接写 async：

\`\`\`tsx
const res = await fetch('https://api.example.com/notes', {
  next: { revalidate: 60 }
})
const notes = await res.json()
\`\`\`

配合 \`revalidate\` 可以做 ISR 级别的缓存。

## 小结

- 默认服务端，按需客户端
- 数据获取与组件同层，少一层 props drilling
- 缓存粒度到 fetch，比整页缓存更灵活`

    content: `# React Server Components

RSC 的核心是把组件树分成「服务端部分」和「客户端部分」。

## 序列化边界

服务端组件传给客户端组件的 props 必须是 **可序列化** 的。

\`\`\`tsx
// 可以
<ClientCard title="hello" count={3} />

// 不行 —— 函数不可序列化
<ClientCard onClick={() => {}} />
\`\`\`

## 组合优于传参

把服务端组件作为 children 传给客户端组件，是绕开边界的常用手法。

> 记住一句话：**服务端组件可以渲染客户端组件，但反过来要通过 children 插槽。**

## 与 Suspense 配合

\`\`\`tsx
<Suspense fallback={<Skeleton />}>
  <SlowNotes />
</Suspense>
\`\`\`

流式渲染让首屏更快到达。`

/* ============================================================================
   Markdown 渲染
   ============================================================================ */
const slugify = s => String(s).toLowerCase().replace(/[^\w\u4e00-\u9fa5]+/g,'-').replace(/^-|-$/g,'');

function inlineMd(s) {
  return s
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>')
    .replace(/~~([^~]+)~~/g, '<del>$1</del>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function mdToHtml(md) {
  let src = String(md).replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/, '');
  const stash = [];
  const keep = html => `\u0000${stash.push(html) - 1}\u0000`;

  src = src.replace(/```(\w*)\r?\n([\s\S]*?)```/g, (m, lang, code) =>
    keep(`<pre class="md-pre"><code>${esc(code.replace(/\n$/,''))}</code></pre>`));
  src = src.replace(/`([^`\n]+)`/g, (m, c) => keep(`<code class="md-code">${esc(c)}</code>`));
  src = esc(src);

  const out = [];
  let listType = null, para = [];
  const flushPara = () => { if (para.length) { out.push(`<p>${inlineMd(para.join(' '))}</p>`); para = []; } };
  const closeList = () => { if (listType) { out.push(listType === 'ul' ? '</ul>' : '</ol>'); listType = null; } };

  for (const raw of src.split(/\r?\n/)) {
    const line = raw.trimEnd();
    if (!line.trim()) { flushPara(); closeList(); continue; }
    let m;
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) {
      flushPara(); closeList();
      const lvl = m[1].length;
      out.push(`<h${lvl} id="${slugify(m[2])}">${inlineMd(m[2])}</h${lvl}>`);
    } else if (/^(-{3,}|\*{3,})$/.test(line.trim())) {
      flushPara(); closeList(); out.push('<hr>');
    } else if ((m = line.match(/^&gt;\s?(.*)$/)) || (m = line.match(/^>\s?(.*)$/))) {
      flushPara(); closeList(); out.push(`<blockquote><p>${inlineMd(m[1])}</p></blockquote>`);
    } else if ((m = line.match(/^[-*+]\s+(.*)$/))) {
      flushPara(); if (listType !== 'ul') { closeList(); out.push('<ul>'); listType = 'ul'; }
      out.push(`<li>${inlineMd(m[1])}</li>`);
    } else if ((m = line.match(/^\d+\.\s+(.*)$/))) {
      flushPara(); if (listType !== 'ol') { closeList(); out.push('<ol>'); listType = 'ol'; }
      out.push(`<li>${inlineMd(m[1])}</li>`);
    } else {
      para.push(line.trim());
    }
  }
  flushPara(); closeList();
  return out.join('\n').replace(/\u0000(\d+)\u0000/g, (m, i) => stash[+i]);
}

function extractToc(md) {
  const toc = [];
  String(md).replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/, '')
    .split(/\r?\n/).forEach(line => {
      const m = line.match(/^(#{2,3})\s+(.*)$/);
      if (m) toc.push({ level: m[1].length, text: m[2].replace(/[*`]/g,''), id: slugify(m[2]) });
    });
  return toc;
}

function toast(msg, type = 'ok') {
  const root = $('#toast-root');
  const el = document.createElement('div');
  const dot = type === 'ok' ? 'bg-accent' : type === 'warn' ? 'bg-amber' : 'bg-white';
  el.className = 'toast-in pointer-events-auto flex items-center gap-3 pl-4 pr-5 py-3 rounded-xl border border-ink-700 bg-ink-800/97 backdrop-blur-xl shadow-card text-[13.5px]';
  el.innerHTML = `<span class="w-1.5 h-1.5 rounded-full ${dot}"></span><span class="text-white">${esc(msg)}</span>`;
  root.appendChild(el);
  setTimeout(() => {
    el.classList.remove('toast-in'); el.classList.add('toast-out');
    setTimeout(() => el.remove(), 280);
  }, 2600);
}

function renderNoteRows() {
  const wrap = $('#note-rows');
  if (!wrap) return;

  const q = state.q.trim().toLowerCase();
  const list = NOTES
    .filter(n => {

      if (state.filter === 'public') return n.public;
      if (state.filter === 'private') return !n.public;
      if (state.filter === 'dirty') return n.dirty;
      return true;
    })
    .filter(n => !q || n.title.toLowerCase().includes(q) || n.path.toLowerCase().includes(q))

function updatePreview() {
  const ta = $('#md-input');
  const pre = $('#md-preview');
  if (!ta || !pre) return;
  pre.innerHTML = mdToHtml(ta.value);
  const lines = ta.value.split('\n').length;
  const lc = $('#line-count');
  if (lc) lc.textContent = `${lines} 行 · ${ta.value.length} 字符`;
}

function syncEditorChrome() {
  if (!editorState) return;
  const dot = $('#dirty-dot');
  const sd = $('#status-dirty');
  if (dot) dot.classList.toggle('hidden', !editorState.dirty);
  if (sd) sd.textContent = editorState.dirty ? '未提交' : '已同步';
}

/* ============================================================================
   路由
   ============================================================================ */
function route() {
  const hash = (location.hash || '#/').replace(/^#/, '');
  const segs = hash.split('/').filter(Boolean);
  if (!segs.length) return { name: 'landing' };
  if (segs[0] === 'auth') return { name: 'auth' };

  if (segs[0] === 'app') {
    if (segs.length === 1) return { name: 'dash' };
    if (segs[1] === 'settings') return { name: 'settings' };
    if (segs[1] === 'notes') {
      if (segs.length === 2) return { name: 'notes' };
      const rest = segs.slice(2);
      const last = rest[rest.length - 1];
      if (last === 'history') { rest.pop(); return { name: 'history', path: rest.join('/') }; }
      if (last === 'compare') { rest.pop(); return { name: 'compare', path: rest.join('/') }; }
      return { name: 'editor', path: rest.join('/') };
    }
  }

  if (segs.length === 1) return { name: 'profile', username: segs[0] };
  return { name: 'pubnote', notePath: segs.slice(1).join('/') };
}

function render() {
  const r = route();
  let html = '';

  switch (r.name) {
    case 'landing':  html = Landing(); break;
    case 'auth':     html = AuthPage(); break;
    case 'dash':     html = OwnerDash(); break;
    case 'notes':    html = OwnerNotes(); break;
    case 'editor':   html = OwnerEditor(r.path); break;
    case 'history':  html = OwnerHistory(r.path); break;
    case 'compare':  html = OwnerCompare(r.path); break;
    case 'settings': html = OwnerSettings(); break;
    case 'profile':  html = VisitorProfile(); break;
    case 'pubnote':  html = VisitorNotePage(r.notePath); break;
    default:         html = NotFoundPage(); break;
  }

  $('#root').innerHTML = html;
  window.scrollTo(0, 0);
  rowSeq = 0;

  if (r.name === 'editor') {
    const note = NOTES.find(n => n.path === r.path);
    if (!editorState || editorState.path !== r.path) {
      editorState = note
        ? { path: note.path, content: note.content, title: note.title, description: note.description,
            tags: [...note.tags], isPublic: note.public, dirty: note.dirty || false }
        : { path: r.path, content: '# 新笔记\n\n开始写点什么…', title: '新笔记',
            description: '', tags: [], isPublic: false, dirty: false };
    }
    const ta = $('#md-input');
    if (ta) ta.value = editorState.content;
    updatePreview();
    syncEditorChrome();
  }

  if (r.name === 'notes') renderNoteRows();

  initNavScroll();
}

/* ============================================================================
   导航滚动
   ============================================================================ */
let navScrollHandler = null;
function initNavScroll() {
  const nav = $('#nf-nav');
  if (navScrollHandler) {
    window.removeEventListener('scroll', navScrollHandler);
    navScrollHandler = null;
  }
  if (!nav) return;

  navScrollHandler = () => {
    if (window.scrollY > 24) nav.classList.add('solid');
    else nav.classList.remove('solid');
  };
  navScrollHandler();
  window.addEventListener('scroll', navScrollHandler, { passive: true });
}

        </div>

description: 
public: false
tags: []
---

开始写点什么…</textarea>

        <button data-modal-close class="px-4 py-2.5 rounded-lg border border-ink-700 text-[13px] text-zinc-400 hover:text-white hover:bg-white/[0.05] transition">取消</button>
        <button data-action="create-note"

          <span class="w-3.5 h-3.5">${I.check}</span>创建并编辑
        </button>
      </div>
    `);

  /* ---------- 确认创建 ---------- */

    if (NOTES.some(n => n.path === p)) { toast('该路径已存在', 'warn'); return; }

    NOTES.unshift({
      path: p, title, description: '', public: false, tags: [],
      updated: '刚刚', ts: Date.now(), sha: 'new0000', commits: 0, dirty: true, content
    });

    closeModal();
    toast('笔记已创建 · 待提交到 GitHub');

  }

              历史记录仍可通过 Git 找回。
            </p>
          </div>
        </div>
        <div class="mt-6 flex items-center gap-3">
          <button data-modal-close class="flex-1 px-4 py-2.5 rounded-lg border border-ink-700 text-[13px] text-zinc-400 hover:text-white hover:bg-white/[0.05] transition">取消</button>
          <button data-action="confirm-delete" data-path="${esc(path)}"
            class="flex-1 px-4 py-2.5 rounded-lg bg-accent hover:bg-accent-400 text-white text-[13px] font-medium transition active:scale-[.97]">
            确认删除
          </button>
        </div>
      </div>
    `);
    return;
  }

  const confirmDel = e.target.closest('[data-action="confirm-delete"]');
  if (confirmDel) {
    const path = confirmDel.dataset.path;
    NOTES = NOTES.filter(n => n.path !== path);
    closeModal();
    toast('已删除并提交到 GitHub');
    if (location.hash.includes(path)) location.hash = '#/app/notes';
    else renderNoteRows();
    return;
  }

  /* ---------- 复制 ---------- */
  const copyBtn = e.target.closest('[data-action="copy"]');
  if (copyBtn) {
    const text = copyBtn.dataset.copy;
    if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
    toast('链接已复制到剪贴板');
    return;
  }

  /* ---------- 通用 toast ---------- */
  const toastBtn = e.target.closest('[data-action="toast"]');
  if (toastBtn) {
    toast(toastBtn.dataset.msg || '操作已完成');
    return;
  }

  /* ---------- 可见性切换 ---------- */
  const visBtn = e.target.closest('[data-action="toggle-visibility"]');
  if (visBtn && editorState) {
    editorState.isPublic = !editorState.isPublic;
    editorState.dirty = true;

    visBtn.className = `flex items-center gap-1.5 px-3 py-2 rounded-lg border transition-all text-[12.5px] font-medium ` +
      (editorState.isPublic
        ? 'border-mint/30 bg-mint/10 text-mint'
        : 'border-ink-700/60 text-ink-300 hover:text-white hover:bg-white/[0.05]');
    visBtn.innerHTML = `<span class="w-3.5 h-3.5">${editorState.isPublic ? I.globe : I.lock}</span><span id="vis-label">${editorState.isPublic ? '公开' : '私密'}</span>`;

    const sv = $('#status-vis');
    if (sv) {
      sv.textContent = editorState.isPublic ? 'public: true' : 'public: false';
      const dot = sv.previousElementSibling;
      if (dot) dot.className = `w-1.5 h-1.5 rounded-full ${editorState.isPublic ? 'bg-mint' : 'bg-ink-500'}`;
    }

    const note = NOTES.find(n => n.path === editorState.path);
    if (note) note.public = editorState.isPublic;

    syncEditorChrome();
    toast(editorState.isPublic
      ? '已设为公开 · notehub.dev/' + USER.username + '/' + editorState.path
      : '已设为私密 · 访客将无法访问');
    return;
  }

  /* ---------- 保存 ---------- */
  const saveBtn = e.target.closest('[data-action="save"]');
  if (saveBtn && editorState) {
    const ta = $('#md-input');
    if (ta) editorState.content = ta.value;
    editorState.title = $('#meta-title')?.value || editorState.title;
    editorState.description = $('#meta-desc')?.value || '';

    const note = NOTES.find(n => n.path === editorState.path);
    if (note) {
      note.content = editorState.content;
      note.title = editorState.title;
      note.description = editorState.description;
      note.public = editorState.isPublic;
    }

    editorState.dirty = false;
    if (note) note.dirty = false;
    syncEditorChrome();
    toast('已保存到本地暂存，尚未提交 GitHub');
    return;
  }

  /* ---------- Commit ---------- */
  const commitBtn = e.target.closest('[data-action="commit"]');
  if (commitBtn && editorState) {
    const ta = $('#md-input');
    if (ta) editorState.content = ta.value;

    modal(`

      </div>
      <div class="px-6 py-4 border-t border-ink-700 flex items-center gap-3 bg-black/20">

  const confirmCommit = e.target.closest('[data-action="confirm-commit"]');
  if (confirmCommit && editorState) {
    const msg = $('#commit-msg')?.value || 'Update note';
    const note = NOTES.find(n => n.path === editorState.path);
    if (note) {
      note.content = editorState.content;
      note.title = editorState.title;
      note.description = editorState.description;
      note.public = editorState.isPublic;
      note.updated = '刚刚';
      note.ts = Date.now();
      note.sha = Math.random().toString(16).slice(2, 9);
      note.dirty = false;
    }
    editorState.dirty = false;
    closeModal();
    syncEditorChrome();
    toast('已提交到 GitHub · ' + msg);
    return;
  }

  /* ---------- 视图切换 ---------- */
  const viewBtn = e.target.closest('[data-view]');
  if (viewBtn) {
    const view = viewBtn.dataset.view;
    $$('.view-btn').forEach(b => {
      const on = b === viewBtn;
      b.classList.toggle('tab-active', on);
      b.classList.toggle('font-medium', on);
      b.classList.toggle('text-ink-300', !on);
      b.classList.toggle('hover:text-white', !on);
    });

    const pe = $('#pane-edit');
    const pp = $('#pane-preview');
    if (!pe || !pp) return;

    if (view === 'edit') {
      pe.classList.remove('hidden'); pe.classList.add('flex');
      pp.classList.add('hidden'); pp.classList.remove('flex');
    } else if (view === 'preview') {
      pe.classList.add('hidden'); pe.classList.remove('flex');
      pp.classList.remove('hidden'); pp.classList.add('flex');
    } else {
      pe.classList.remove('hidden'); pe.classList.add('flex');
      pp.classList.remove('hidden'); pp.classList.add('flex');
    }
    return;
  }

  /* ---------- 目录滚动 ---------- */
  const tocLink = e.target.closest('[data-toc]');
  if (tocLink) {
    e.preventDefault();
    const el = document.getElementById(tocLink.dataset.toc);
    if (el) {
      const y = el.getBoundingClientRect().top + window.scrollY - 96;
      window.scrollTo({ top: y, behavior: 'smooth' });
    }
    return;
  }

/* ---------- 输入 ---------- */
document.addEventListener('input', e => {
  if (e.target.id === 'note-search') {
    state.q = e.target.value;
    renderNoteRows();
    return;

  if (e.target.id === 'md-input') {
    if (editorState) {
      editorState.content = e.target.value;
      if (!editorState.dirty) {
        editorState.dirty = true;
        const note = NOTES.find(n => n.path === editorState.path);
        if (note) note.dirty = true;
        syncEditorChrome();
      }
    }
    updatePreview();
    return;
  }

  if (e.target.id === 'meta-title' && editorState) {
    editorState.title = e.target.value;
    if (!editorState.dirty) {
      editorState.dirty = true;
      const note = NOTES.find(n => n.path === editorState.path);
      if (note) note.dirty = true;
      syncEditorChrome();
    }
    return;
  }

  if (e.target.id === 'meta-desc' && editorState) {
    editorState.description = e.target.value;
    if (!editorState.dirty) {
      editorState.dirty = true;
      syncEditorChrome();
    }
  }
});

/* ---------- 快捷键 ---------- */
document.addEventListener('keydown', e => {
  const meta = e.metaKey || e.ctrlKey;
  if (!meta) return;

  if (e.key === 's') {
    e.preventDefault();
    const btn = document.querySelector('[data-action="save"]');
    if (btn) btn.click();
    else toast('当前页面无需保存');
    return;
  }

  if (e.key === 'Enter' && e.shiftKey) {
    const btn = document.querySelector('[data-action="commit"]');
    if (btn) { e.preventDefault(); btn.click(); }
    return;
  }

  if (e.key === 'k') {
    const search = document.querySelector('#note-search');
    if (search) { e.preventDefault(); search.focus(); }
  }
});

/* ---------- 启动 ---------- */
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', () => {
  if (!location.hash) location.hash = '#/';
  render();
});
if (document.readyState !== 'loading') {
  if (!location.hash) location.hash = '#/';
  render();
}
</script>
