<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoteVault UI Prototype</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f5f5f7;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
:root{--purple:#6d5dfc;--purple2:#8174ff;--line:#e7e7ea;--muted:#77777f;--soft:#f7f7f8;--green:#15945d}
.topbar{height:64px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 30px;gap:28px;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800;letter-spacing:-.03em}
.logo{height:31px;width:31px;border-radius:9px;background:linear-gradient(135deg,#17171a,#7568ff);color:#fff;display:flex;align-items:center;justify-content:center}
.nav{display:flex;gap:4px}.nav button{border:0;background:transparent;padding:8px 12px;border-radius:8px;color:#666}.nav button.active,.nav button:hover{background:#f0f0f2;color:#111}
.top-search{margin-left:auto;border:1px solid var(--line);background:#fafafa;height:35px;width:230px;border-radius:9px;display:flex;align-items:center;padding:0 11px;color:#aaa;font-size:13px}
.me{width:33px;height:33px;border-radius:50%;background:linear-gradient(135deg,#ddd7ff,#aaa1ff);display:flex;align-items:center;justify-content:center;font-weight:750}
.page{max-width:1180px;margin:auto;padding:45px 25px}
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:35px;align-items:center;padding:10px 0 45px}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--purple);font-weight:800}
h1{font-size:48px;line-height:1.05;letter-spacing:-.055em;margin:12px 0 16px}
.hero p{font-size:17px;line-height:1.7;color:#72727a;max-width:650px}
.hero-visual{border:1px solid #dedaff;background:linear-gradient(145deg,#fff,#f0edff);border-radius:24px;padding:24px;box-shadow:0 20px 50px #4c3cbd12}
.avatar{width:50px;height:50px;border-radius:15px;background:linear-gradient(135deg,#bcb4ff,#6758ef);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px}
.person{display:flex;align-items:center;gap:12px}.person b{display:block}.person span{font-size:12px;color:#777}
.mini-box{margin-top:22px;background:#fff;border:1px solid #e3e0f8;border-radius:14px;padding:16px}.mini-box-title{font-weight:750}.mini-box small{display:block;color:#888;margin-top:3px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.pill{font-size:11px;border-radius:999px;padding:4px 8px;background:#f0eefc;color:#5c50ba}
.section-title{display:flex;justify-content:space-between;align-items:end;margin-bottom:15px}.section-title h2{margin:0;font-size:22px;letter-spacing:-.03em}.section-title span{font-size:12px;color:#999}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:19px;box-shadow:0 4px 16px #00000008;transition:.18s}
.card:hover{transform:translateY(-2px);box-shadow:0 12px 30px #0000000d}
.card-top{display:flex;justify-content:space-between;align-items:center}.file{width:38px;height:38px;background:#f1f1f3;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800}
.public{font-size:10px;color:var(--green);background:#eaf8f1;border-radius:999px;padding:4px 8px}.private{font-size:10px;color:#777;background:#f1f1f1;border-radius:999px;padding:4px 8px}
.card h3{margin:16px 0 6px;font-size:17px}.card p{margin:0;color:#777;font-size:13px;line-height:1.65;min-height:42px}.card-foot{border-top:1px solid #f0f0f1;margin-top:15px;padding-top:11px;display:flex;justify-content:space-between;color:#999;font-size:11px}
.btn{height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 13px;color:#444}.primary{background:#18181b;color:#fff;border-color:#18181b}.purple{background:var(--purple);color:#fff;border-color:var(--purple)}
/* public profile */
.profile-head{background:#fff;border:1px solid var(--line);border-radius:20px;padding:27px;display:flex;align-items:center;gap:20px;box-shadow:0 8px 28px #00000008}.profile-avatar{width:78px;height:78px;border-radius:22px;background:linear-gradient(135deg,#b9b0ff,#6656ef);color:#fff;font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center}.profile-info h1{font-size:30px;margin:0 0 5px}.profile-info p{margin:0;color:#777}.profile-stats{margin-left:auto;display:flex;gap:25px;text-align:center}.profile-stats b{font-size:22px;display:block}.profile-stats span{font-size:11px;color:#999}.filterbar{display:flex;gap:5px;background:#fff;border:1px solid var(--line);padding:6px;border-radius:11px;margin:22px 0 15px}.filterbar button{border:0;background:transparent;padding:7px 11px;border-radius:7px;color:#777}.filterbar button.active{background:#19191c;color:#fff}
/* reader */
.reader{max-width:1050px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:35px}
.article-box{background:#fff;border:1px solid var(--line);border-radius:20px;padding:44px 55px;box-shadow:0 7px 25px #00000008}.crumb{font-size:12px;color:#999;margin-bottom:25px}.article-box h1{font-size:40px;margin:0 0 8px}.article-meta{font-size:12px;color:#999;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:28px}.article h2{font-size:23px;margin:29px 0 9px}.article h3{font-size:17px}.article p{font-size:15px;line-height:1.85;color:#414141}.article code{background:#f2f2f3;padding:2px 5px;border-radius:4px}.article pre{background:#1c1c20;color:#e6e6e9;border-radius:11px;padding:17px;overflow:auto}.article blockquote{margin:20px 0;padding:10px 17px;border-left:3px solid var(--purple);background:#f7f5ff;color:#615a8d}.toc{position:sticky;top:90px;height:max-content}.toc strong{font-size:11px}.toc a{display:block;font-size:12px;color:#999;padding:5px 0}.toc a.active{color:var(--purple);font-weight:700}.share{width:100%;margin-top:16px}
/* admin */
.admin{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 64px)}
.aside{background:#fff;border-right:1px solid var(--line);padding:22px 12px}.aside-title{font-weight:800;padding:5px 10px 20px}.aside-group{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:.08em;padding:14px 10px 5px}.aside button{width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;color:#666}.aside button.active,.aside button:hover{background:#f0eff1;color:#111;font-weight:650}
.admin-main{padding:30px;max-width:1180px;width:100%}.admin-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:21px}.admin-head h1{font-size:27px;margin:0}.sub{font-size:12px;color:#999}.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:17px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px}.stat small{color:#999}.stat b{font-size:24px;display:block;margin-top:3px}.admin-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.panel-head{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between}.row{display:flex;align-items:center;gap:11px;padding:13px 16px;border-bottom:1px solid #f0f0f1}.row:last-child{border:0}.row-main{flex:1}.row-main b{display:block;font-size:13px}.row-main small{color:#999}.status{font-size:10px;border-radius:999px;padding:4px 8px}.status.public{background:#eaf8f1;color:var(--green)}.status.private{background:#f1f1f1;color:#777}
/* editor */
.editor{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px}.editor-main,.editor-side{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.toolbar{height:47px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:3px;padding:0 8px}.toolbar button{border:0;background:transparent;border-radius:6px;padding:6px 9px;color:#666}.edit-title{font-size:27px;font-weight:760;border:0;outline:0;width:100%;padding:23px 25px 3px}.path{font-size:11px;color:#999;padding:0 25px}.edit-area{min-height:490px;padding:15px 25px;outline:0;line-height:1.8}.commitbar{border-top:1px solid var(--line);padding:11px;display:flex;gap:7px}.commitbar input{flex:1;border:1px solid var(--line);border-radius:8px;padding:0 10px}.side-section{padding:16px;border-bottom:1px solid var(--line)}.side-section:last-child{border:0}.side-section h4{margin:0 0 9px}.toggle{height:23px;width:40px;background:#19191c;border-radius:99px;position:relative}.toggle:after{content:"";position:absolute;width:17px;height:17px;right:3px;top:3px;background:#fff;border-radius:50%}
/* history */
.history{display:grid;grid-template-columns:280px 1fr;gap:15px}.commit-list,.diffbox{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.commit{padding:14px;border-bottom:1px solid var(--line);cursor:pointer}.commit:hover,.commit.selected{background:#f7f7f6}.commit b{font-size:12px;display:block}.commit small{font-size:11px;color:#999}.diff-header{padding:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.diff-cols{display:grid;grid-template-columns:1fr 1fr}.diff-col{font:12px/1.8 ui-monospace,SFMono-Regular,Menlo,monospace}.diff-title{padding:9px 12px;background:#f7f7f6;border-bottom:1px solid var(--line)}.line{padding:3px 12px;white-space:pre-wrap}.add{background:#edfcf3}.del{background:#fff0f1}.ln{display:inline-block;width:28px;color:#aaa}
/* settings */
.settings{display:grid;grid-template-columns:190px 1fr;gap:15px}.settings-nav,.settings-form{background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px}.settings-nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px;border-radius:7px;color:#666}.settings-nav button.active{background:#f0eff1;color:#111;font-weight:650}.settings-form{padding:22px}.field{margin-bottom:20px}.field label{display:block;font-weight:700;margin-bottom:5px}.field small{display:block;color:#999;margin-bottom:8px}.input{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;padding:0 10px}.select{height:38px;border:1px solid var(--line);border-radius:8px;padding:0 9px;background:#fff}
/* view */
.view{display:none}.view.active{display:block}
@media(max-width:900px){.hero{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.admin{grid-template-columns:1fr}.aside{display:none}.admin-grid,.editor,.history,.settings,.reader{grid-template-columns:1fr}.toc{display:none}.profile-head{align-items:flex-start}.profile-stats{margin-left:0}}
@media(max-width:600px){.topbar{padding:0 14px}.nav,.top-search{display:none}.page{padding:28px 15px}.hero h1{font-size:36px}.cards{grid-template-columns:1fr}.profile-head{display:block}.profile-stats{margin-top:18px;justify-content:space-between}.article-box{padding:28px 20px}.article-box h1{font-size:30px}.admin-main{padding:20px 15px}.stats4{grid-template-columns:1fr 1fr}.diff-cols{grid-template-columns:1fr}.diff-col+ .diff-col{border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const notes=[
["Next.js App Router","记录 App Router、Server Components、Server Actions 与项目实践。","frontend/nextjs.md","2h ago"],
["NestJS Hexagonal Architecture","从 Controller 到 Domain、Infrastructure 的架构实践与依赖倒置。","backend/nestjs.md","Yesterday"],
["AI Agent Memory","Agent、RAG、Memory 与本地模型实践笔记。","ai/agent.md","2d ago"],
["PostgreSQL JOIN","LEFT JOIN、关系查询、聚合与 TypeORM 查询构建器。","database/postgres.md","4d ago"],
["Spring Security","认证、授权、RBAC 与 @PreAuthorize 的学习记录。","backend/spring-security.md","5d ago"],
["Docker Compose","容器、网络、环境变量和生产部署实践。","devops/docker.md","1w ago"]
];
function header(active){
return `<header class="topbar"><a class="brand" href="#" onclick="showPage('home')"><span class="logo">N</span>NoteVault</a><nav class="nav"><button class="${active==='home'?'active':''}" onclick="showPage('home')">Home</button><button class="${active==='explore'?'active':''}" onclick="showPage('explore')">Explore</button><button onclick="showPage('profile')">Profile</button></nav><div class="top-search">⌕ &nbsp; Search public notes</div><button class="btn" onclick="showPage('admin')">My Vault</button><span class="me">Z</span></header>`;
}
function noteCards(){
return notes.map(n=>`<article class="card" onclick="showPage('read')"><div class="card-top"><span class="file">M</span><span class="public">● Public</span></div><h3>${n[0]}</h3><p>${n[1]}</p><div class="pills"><span class="pill">${n[2].split("/")[0]}</span></div><div class="card-foot"><span>${n[2]}</span><span>${n[3]}</span></div></article>`).join("");
}
function home(){
return header("home")+`<main class="page"><section class="hero"><div><div class="kicker">Git-backed personal knowledge</div><h1>Your GitHub notes.<br>Open to the world.</h1><p>NoteVault 将 GitHub Repository 变成一个漂亮的个人知识库。私有笔记只属于你，公开笔记则自动拥有独立 URL，并汇聚到你的公开 Profile。</p><div style="display:flex;gap:8px;margin-top:22px"><button class="btn primary" onclick="showPage('admin')">Open My Vault</button><button class="btn" onclick="showPage('profile')">View public profile</button></div></div><div class="hero-visual"><div class="person"><div class="avatar">Z</div><div><b>zhoulinfeng</b><span>Developer · AI · Backend · Frontend</span></div></div><div class="mini-box"><div class="mini-box-title">Public Knowledge</div><small>24 public notes · 9 topics · GitHub backed</small><div class="pills"><span class="pill">Next.js</span><span class="pill">NestJS</span><span class="pill">AI Agent</span><span class="pill">Spring</span></div></div></div></section><div class="section-title"><div><h2>Latest public notes</h2><span>Knowledge shared by zhoulinfeng</span></div><button class="btn" onclick="showPage('explore')">View all →</button></div><div class="cards">${noteCards()}</div></main>`;
}
function explore(){
return header("explore")+`<main class="page"><div class="profile-head"><div class="profile-avatar">Z</div><div class="profile-info"><h1>zhoulinfeng</h1><p>Developer · TypeScript · Java · AI · Building things with code.</p></div><div class="profile-stats"><div><b>24</b><span>Public notes</span></div><div><b>9</b><span>Topics</span></div><div><b>186</b><span>Commits</span></div></div></div><div class="filterbar"><button class="active">All</button><button>Frontend</button><button>Backend</button><button>AI</button><button>Database</button><button>DevOps</button></div><div class="cards">${noteCards()}</div></main>`;
}
function profile(){
return header("explore")+`<main class="page"><section style="max-width:850px;margin:auto;text-align:center;padding:20px 0 30px"><div class="profile-avatar" style="margin:auto">Z</div><div class="kicker" style="margin-top:17px">Public Knowledge</div><h1 style="font-size:40px;margin:8px 0">zhoulinfeng's notes</h1><p style="color:#777;font-size:15px">All public notes from my GitHub knowledge repository.<br>Private notes are never exposed here.</p><div style="display:flex;justify-content:center;gap:22px;color:#888;font-size:12px"><span><b style="color:#171717;font-size:19px">24</b> notes</span><span><b style="color:#171717;font-size:19px">9</b> topics</span><span><b style="color:#171717;font-size:19px">186</b> commits</span></div></section><div class="section-title"><h2>All public notes</h2><span>24 notes</span></div><div class="cards">${noteCards()}</div></main>`;
}
function read(){
return header("explore")+`<main class="page"><div class="reader"><article class="article-box"><div class="crumb">zhoulinfeng / frontend / nextjs.md</div><h1>Next.js App Router</h1><div class="article-meta">Updated 2 hours ago · 9f3c1a2 · <span style="color:var(--green)">● Public</span></div><div class="article"><p>Next.js App Router 基于 React Server Components，使用 <code>app/</code> 目录组织路由和页面。</p><h2>核心概念</h2><p>页面通过文件系统路由生成。<code>page.tsx</code> 表示页面，<code>layout.tsx</code> 表示共享布局，<code>loading.tsx</code> 可以提供加载状态。</p><blockquote>Server Component 是 App Router 最重要的心智模型之一：默认优先在服务端完成数据获取和渲染。</blockquote><h2>Server Actions</h2><p>可以将服务端 mutation 与组件组合，让表单提交等操作更加自然。</p><pre>app/
├── layout.tsx
├── page.tsx
├── notes/
│   └── [slug]/
│       └── page.tsx
└── api/
    └── github/
        └── route.ts</pre><h2>我的实践</h2><p>NoteVault 本身就是一个实践案例：GitHub Repository 作为 Source of Truth，Next.js 负责公开阅读、编辑、搜索和版本历史。</p></div></article><aside class="toc"><strong>ON THIS PAGE</strong><a class="active">核心概念</a><a>Server Actions</a><a>我的实践</a><button class="btn share" onclick="alert('Public link copied')">↗ Copy public link</button><button class="btn share" onclick="showPage('publicHistory')">◷ View history</button></aside></div></main>`;
}
function admin(){
return header("")+`<div class="admin"><aside class="aside"><div class="aside-title">My Vault</div><div class="aside-group">Workspace</div><button class="active" onclick="adminTab('dashboard',this)">⌂ Overview</button><button onclick="adminTab('notes',this)">▤ Notes</button><button onclick="adminTab('editor',this)">✎ Editor</button><button onclick="adminTab('history',this)">◷ History</button><button onclick="adminTab('compare',this)">⇄ Compare</button><div class="aside-group">Publish</div><button onclick="adminTab('settings',this)">⚙ Settings</button><button onclick="showPage('profile')">↗ Public profile</button></aside><main class="admin-main" id="adminMain"></main></div>`;
}
function adminTab(t,btn){
document.querySelectorAll(".aside button").forEach(x=>x.classList.remove("active"));if(btn)btn.classList.add("active");
let c=document.getElementById("adminMain");
const rows=notes.map((n,i)=>`<div class="row"><span class="file">M</span><div class="row-main"><b>${n[0]}</b><small>${n[2]}</small></div><span class="status ${i===3?'private':'public'}">${i===3?'Private':'Public'}</span><button class="btn" onclick="adminTab('editor')">Edit</button></div>`).join("");
if(t==="dashboard")c.innerHTML=`<div class="admin-head"><div><h1>Knowledge Dashboard</h1><span class="sub">zhoulinfeng / notes · main · GitHub synced</span></div><button class="btn primary" onclick="adminTab('editor')">＋ New note</button></div><div class="stats4"><div class="stat"><small>Total notes</small><b>48</b></div><div class="stat"><small>Public notes</small><b>24</b></div><div class="stat"><small>Private notes</small><b>24</b></div><div class="stat"><small>Commits</small><b>186</b></div></div><div class="admin-grid"><div class="panel"><div class="panel-head">Recently updated <span class="sub">View all</span></div>${rows}</div><div class="panel"><div class="panel-head">Repository</div><div class="row"><div class="row-main"><b>zhoulinfeng/notes</b><small>GitHub Repository</small></div></div><div class="row"><div class="row-main"><b>main</b><small>Current branch</small></div><span class="status public">Synced</span></div><div class="row"><div class="row-main"><b>24 public</b><small>Visible on public profile</small></div></div></div></div>`;
if(t==="notes")c.innerHTML=`<div class="admin-head"><div><h1>Notes</h1><span class="sub">Manage content and visibility.</span></div><button class="btn primary" onclick="adminTab('editor')">＋ New note</button></div><div class="panel"><div class="panel-head">All notes <span class="sub">48 total</span></div>${rows+rows.slice(0,2)}</div>`;
if(t==="editor")c.innerHTML=`<div class="admin-head"><div><h1>Edit Note</h1><span class="sub">frontend/nextjs.md · Changes become a Git commit</span></div><button class="btn" onclick="adminTab('history')">History</button></div><div class="editor"><div class="editor-main"><div class="toolbar"><button><b>B</b></button><button><i>I</i></button><button>H2</button><button>Code</button><button>Link</button><button>List</button></div><input class="edit-title" value="Next.js App Router"><div class="path">frontend/nextjs.md</div><div class="edit-area" contenteditable="true"><h2>App Router</h2><p>Next.js App Router 基于 React Server Components，使用 app/ 目录组织路由和页面。</p><h3>核心概念</h3><p>这里编辑你的 Markdown 笔记。保存后 NoteVault 会通过 GitHub API 创建 commit。</p><pre>const page = await getPage()</pre></div><div class="commitbar"><input value="docs: update nextjs note"><button class="btn primary">Commit to GitHub</button></div></div><aside class="editor-side"><div class="side-section"><h4>Visibility</h4><div style="display:flex;justify-content:space-between;align-items:center"><div><b>Public</b><small style="display:block;color:#999">Anyone can view this note</small></div><div class="toggle"></div></div></div><div class="side-section"><h4>Public URL</h4><small style="color:#888">notevault.app/zhoulinfeng/frontend/nextjs</small></div><div class="side-section"><h4>Tags</h4><div class="pills"><span class="pill">Next.js</span><span class="pill">React</span></div></div><div class="side-section"><h4>Repository</h4><small style="color:#888">zhoulinfeng/notes<br>branch: main</small></div></aside></div>`;
if(t==="history")c.innerHTML=`<div class="admin-head"><div><h1>Version History</h1><span class="sub">Git commits for nextjs.md</span></div><button class="btn primary" onclick="adminTab('compare')">Compare revisions</button></div><div class="panel">${["feat: add server actions","docs: update examples","docs: add app router notes","init: create nextjs note"].map((x,i)=>`<div class="row"><span class="file">↻</span><div class="row-main"><b>${x}</b><small>zhoulinfeng · ${i+1} days ago · ${["9f3c1a2","82ad31e","1ab72cc","5d91ee0"][i]}</small></div><button class="btn" onclick="adminTab('compare')">Compare</button></div>`).join("")}</div>`;
